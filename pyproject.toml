[project]
name = "autrad-ai"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
