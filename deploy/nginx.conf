worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 30;
  server_tokens off;

  # Compression for anything the API/gzip middleware didn't already compress
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  # Load balancer: least-connections across API replicas, passive health checks
  upstream autrad_api {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed build assets: cache forever at browser + CDN (filenames change on every build)
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://autrad_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
    }

    location ~ ^/(health|ready)$ { proxy_pass http://autrad_api; }

    # SPA shell: always revalidate so new deploys are picked up immediately
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
