name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pip-audit -r requirements.txt           # known-vulnerable deps fail the build
      - run: pytest -q                               # unit + risk stress + API tests
      - name: Backtest gate (mechanics)
        run: python -m scripts.run_backtest > backtest.json
      - uses: actions/upload-artifact@v4
        with: { name: backtest, path: backtest.json }
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx depcheck --ignores="@types/*,vite,typescript,@vitejs/plugin-react"   # unused deps fail the build
      - run: npm run typecheck
      - run: npm run build
